<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#12151f" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>

    <!-- Glowing Cyan & Purple Gradients -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c4dff" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes stylus-motion {
      0% { transform: translate(140px, 120px) rotate(-28deg); }
      25% { transform: translate(220px, 180px) rotate(-24deg); }
      50% { transform: translate(170px, 260px) rotate(-32deg); }
      75% { transform: translate(250px, 210px) rotate(-26deg); }
      100% { transform: translate(140px, 120px) rotate(-28deg); }
    }

    @keyframes mac-cursor-motion {
      0% { transform: translate(660px, 130px); }
      25% { transform: translate(740px, 190px); }
      50% { transform: translate(690px, 270px); }
      75% { transform: translate(770px, 220px); }
      100% { transform: translate(660px, 130px); }
    }

    @keyframes ripple-pulse {
      0% { r: 4px; opacity: 1; stroke-width: 3px; }
      100% { r: 36px; opacity: 0; stroke-width: 1px; }
    }

    @keyframes packet-stream {
      0% { stroke-dashoffset: 400; opacity: 0.2; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }

    @keyframes stroke-draw {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }

    .stylus-group {
      animation: stylus-motion 5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .mac-cursor {
      animation: mac-cursor-motion 5s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    .pulse-ring-1 {
      animation: ripple-pulse 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    .pulse-ring-2 {
      animation: ripple-pulse 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite 0.7s;
    }

    .packet-line {
      stroke-dasharray: 12 16;
      animation: packet-stream 2s linear infinite;
    }

    .animated-drawing {
      stroke-dasharray: 600;
      animation: stroke-draw 5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="420" rx="16" fill="url(#bg-grad)" />
  <rect width="958" height="418" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="0.8">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="880" y1="0" x2="880" y2="420" />
    <line x1="0" y1="100" x2="960" y2="100" />
    <line x1="0" y1="210" x2="960" y2="210" />
    <line x1="0" y1="320" x2="960" y2="320" />
  </g>

  <!-- LEFT: Universal Tablet / Phone Device -->
  <g transform="translate(50, 45)" filter="url(#soft-shadow)">
    <!-- Universal Tablet Frame (Slim Bezel Aluminum) -->
    <rect width="270" height="330" rx="18" fill="#181a20" stroke="#323742" stroke-width="2.5" />
    <!-- Dynamic OLED / Retina Display -->
    <rect width="254" height="314" x="8" y="8" rx="12" fill="#0c0e12" stroke="rgba(0,229,255,0.25)" stroke-width="1.2" />
    <!-- Front Sensor Punch-hole -->
    <circle cx="135" cy="22" r="4.5" fill="#1e222b" stroke="#3a4050" stroke-width="1" />
    <circle cx="135" cy="22" r="1.8" fill="#00e5ff" opacity="0.6" />

    <!-- Active Canvas Pattern on Phone/Tablet -->
    <path d="M 35,100 Q 90,60 150,110 T 225,180 T 145,260 T 70,200" fill="none" stroke="rgba(0, 229, 255, 0.4)" stroke-width="3" stroke-linecap="round" class="animated-drawing" />

    <!-- Device Compatibility Badge -->
    <rect x="20" y="280" width="230" height="26" rx="6" fill="rgba(0,0,0,0.65)" stroke="rgba(0,229,255,0.3)" stroke-width="1" />
    <text x="135" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" text-anchor="middle">Any Phone / Tablet • Android &amp; iPad</text>
  </g>

  <!-- MIDDLE: Animated Fast-Path Transmission Tunnel -->
  <g transform="translate(335, 140)">
    <!-- Connecting Laser Tunnel Paths -->
    <path d="M 0,40 C 90,0 120,80 210,40" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <path d="M 0,40 C 90,0 120,80 210,40" fill="none" stroke="url(#neon-cyan)" stroke-width="3.5" class="packet-line" filter="url(#glow-cyan)" />
    
    <path d="M 0,70 C 90,110 120,30 210,70" fill="none" stroke="url(#neon-purple)" stroke-width="2.5" class="packet-line" />

    <!-- Center Bridge Badge -->
    <g transform="translate(65, 22)">
      <rect width="84" height="48" rx="10" fill="rgba(18, 21, 30, 0.9)" stroke="rgba(0,229,255,0.4)" stroke-width="1.5" />
      <text x="42" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#8892b0" text-anchor="middle">SUB-MS LINK</text>
      <text x="42" y="38" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="13" font-weight="900" fill="#00e676" text-anchor="middle">&lt; 1.2 ms</text>
    </g>

    <text x="105" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Universal 12-Byte Frame</text>
  </g>

  <!-- RIGHT: macOS MacBook Pro Window & Native Canvas -->
  <g transform="translate(560, 45)" filter="url(#soft-shadow)">
    <!-- MacBook Chassis -->
    <rect width="340" height="330" rx="14" fill="#16181f" stroke="#2e3442" stroke-width="2.5" />
    <!-- Window Title Bar -->
    <path d="M 0,14 C 0,6 6,0 14,0 L 326,0 C 334,0 340,6 340,14 L 340,36 L 0,36 Z" fill="#20242e" />
    <circle cx="18" cy="18" r="5" fill="#ff5f56" />
    <circle cx="34" cy="18" r="5" fill="#ffbd2e" />
    <circle cx="50" cy="18" r="5" fill="#27c93f" />
    <text x="170" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle">macOS Native Canvas (Quartz Event Tap)</text>

    <!-- Canvas Inner Viewport -->
    <rect width="324" height="278" x="8" y="44" rx="8" fill="#090a0f" stroke="rgba(255,255,255,0.05)" stroke-width="1" />

    <!-- Synced Drawing on Mac Screen -->
    <path d="M 50,110 Q 120,70 190,120 T 270,190 T 170,260 T 90,210" fill="none" stroke="url(#neon-cyan)" stroke-width="4.5" stroke-linecap="round" class="animated-drawing" filter="url(#glow-cyan)" />

    <!-- Status Bar at bottom -->
    <rect x="18" y="284" width="304" height="28" rx="6" fill="rgba(255,255,255,0.04)" />
    <text x="28" y="302" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="11" fill="#00e5ff">PRESSURE: 0.842 • TILT: -14° • 4096 LVLS</text>
  </g>

  <!-- ANIMATED STYLUS / PEN -->
  <g class="stylus-group">
    <!-- Pressure Wave Pulses -->
    <circle cx="0" cy="0" fill="none" stroke="#00e5ff" class="pulse-ring-1" />
    <circle cx="0" cy="0" fill="none" stroke="#00e676" class="pulse-ring-2" />
    
    <!-- Stylus Body -->
    <path d="M 0,0 L -12,-30 L -16,-140 L -6,-142 L -2,-30 Z" fill="#242833" stroke="#4a5266" stroke-width="1.5" />
    <polygon points="0,0 -4,-12 4,-12" fill="#00e5ff" filter="url(#glow-cyan)" />
    <rect x="-8" y="-70" width="4" height="18" rx="1.5" fill="#00e676" />
  </g>

  <!-- ANIMATED CURSOR ON MAC -->
  <g class="mac-cursor">
    <circle cx="0" cy="0" r="10" fill="rgba(0,229,255,0.18)" stroke="#00e5ff" stroke-width="1.8" />
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#00e5ff" stroke-width="1.5" />
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#00e5ff" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>
</svg>
