<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <filter id="cursor-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes text-reveal-1 {
      0% { opacity: 0; }
      15% { opacity: 1; }
      100% { opacity: 1; }
    }

    @keyframes text-reveal-2 {
      0%, 25% { opacity: 0; }
      40% { opacity: 1; }
      100% { opacity: 1; }
    }

    @keyframes text-reveal-3 {
      0%, 50% { opacity: 0; }
      65% { opacity: 1; }
      100% { opacity: 1; }
    }

    .cursor-block {
      animation: blink 1s infinite;
    }

    .seq-1 { animation: text-reveal-1 8s infinite; }
    .seq-2 { animation: text-reveal-2 8s infinite; }
    .seq-3 { animation: text-reveal-3 8s infinite; }
  </style>

  <!-- Terminal Window Shell -->
  <rect width="960" height="400" rx="14" fill="url(#term-bg)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Window Header -->
  <path d="M 0,14 C 0,6 6,0 14,0 L 946,0 C 954,0 960,6 960,14 L 960,40 L 0,40 Z" fill="#21262d" />
  <circle cx="22" cy="20" r="6" fill="#ff5f56" />
  <circle cx="42" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="20" r="6" fill="#27c93f" />
  <text x="480" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">zsh — ./start.sh start (Universal Tablet &amp; Stylus Engine)</text>

  <!-- Terminal Body Text -->
  <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" line-height="1.6">
    <!-- Command Prompt Line -->
    <text x="30" y="75" fill="#7ee787">anantraj@MacBook-Air</text>
    <text x="195" y="75" fill="#8b949e">:</text>
    <text x="210" y="75" fill="#79c0ff">~/Desktop/family</text>
    <text x="350" y="75" fill="#c9d1d9">$ ./start.sh start</text>

    <!-- Sequence 1: Init & Banner -->
    <g class="seq-1">
      <text x="30" y="110" fill="#00e5ff" font-weight="bold">🚀 [Launch] Starting native Quartz tablet daemon (family-daemon)...</text>
      <text x="30" y="132" fill="#7ee787">⚡ [Launch] Starting WebSocket bridge on port 9877 and HTTP on port 8080...</text>
      <text x="30" y="154" fill="#58a6ff">✅ [Status] Universal engine active. Listening on UDP port 9876.</text>
    </g>

    <!-- Sequence 2: Connection URL -->
    <g class="seq-2">
      <text x="30" y="190" fill="#f0883e">📱 UNIVERSAL PAIRING LINK:</text>
      <text x="240" y="190" fill="#00e5ff" text-decoration="underline">http://10.7.17.83:8080</text>
      
      <!-- Mini Terminal QR Simulation -->
      <g transform="translate(30, 210)">
        <rect width="18" height="18" fill="#c9d1d9" />
        <rect width="10" height="10" x="4" y="4" fill="#0d1117" />
        <rect width="4" height="4" x="7" y="7" fill="#c9d1d9" />

        <rect width="18" height="18" x="24" y="0" fill="#c9d1d9" opacity="0.6" />
        <rect width="18" height="18" x="48" y="0" fill="#c9d1d9" />
        <rect width="10" height="10" x="52" y="4" fill="#0d1117" />
        <rect width="4" height="4" x="55" y="7" fill="#c9d1d9" />

        <rect width="18" height="18" x="0" y="24" fill="#c9d1d9" opacity="0.7" />
        <rect width="18" height="18" x="24" y="24" fill="#c9d1d9" />
        <rect width="18" height="18" x="48" y="24" fill="#c9d1d9" opacity="0.4" />

        <rect width="18" height="18" x="0" y="48" fill="#c9d1d9" />
        <rect width="10" height="10" x="4" y="52" fill="#0d1117" />
        <rect width="4" height="4" x="7" y="55" fill="#c9d1d9" />

        <rect width="18" height="18" x="24" y="48" fill="#c9d1d9" opacity="0.8" />
        <rect width="18" height="18" x="48" y="48" fill="#c9d1d9" />
      </g>

      <text x="110" y="235" fill="#8b949e">Compatible with Any Device: Android Phones, Galaxy Tabs, iPads</text>
      <text x="110" y="255" fill="#8b949e">Browser: Chrome / Safari / Samsung Internet (Zero Install)</text>
    </g>

    <!-- Sequence 3: Active Stylus Ingress -->
    <g class="seq-3">
      <text x="30" y="315" fill="#7ee787">📱 [Link] Tablet / Stylus device connected via Low-Latency Fast-Path!</text>
      <text x="30" y="340" fill="#58a6ff">📊 Telemetry Ingress: <tspan fill="#7ee787">240.2 Hz</tspan> | Pressure: <tspan fill="#00e5ff">0.781</tspan> | Tilt: <tspan fill="#d2a8ff">-12°</tspan> | Latency: <tspan fill="#7ee787">0.9 ms</tspan></text>
      <text x="30" y="365" fill="#8b949e">To stop services, execute: <tspan fill="#f0883e">./start.sh stop</tspan></text>
      
      <!-- Blinking Terminal Prompt -->
      <rect x="440" y="352" width="9" height="16" fill="#7ee787" class="cursor-block" filter="url(#cursor-glow)" />
    </g>
  </g>
</svg>
