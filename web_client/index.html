<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Family Continuity • S Pen Graphics Digitizer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0b0d; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas-area { width: 100vw; height: 100vh; touch-action: none; position: relative; background: radial-gradient(circle at center, #15161c 0%, #07080a 100%); cursor: crosshair; }
        
        #hud { position: absolute; top: 16px; left: 16px; font-size: 13px; color: #888; pointer-events: none; z-index: 10; line-height: 1.5; background: rgba(0,0,0,0.65); padding: 10px 16px; border-radius: 10px; backdrop-filter: blur(10px); border: 1px solid rgba(0,229,255,0.2); }
        .hud-val { color: #00e5ff; font-weight: bold; font-family: monospace; }
        #indicator { position: absolute; border: 2px solid #00e5ff; border-radius: 50%; pointer-events: none; display: none; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(0,229,255,0.5); will-change: transform, left, top; }
        
        #instructions {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.45);
            pointer-events: none;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div>Link: <span id="conn-status" class="hud-val">Connecting...</span></div>
        <div>S Pen Pressure: <span id="pressure-val" class="hud-val">0.000</span></div>
        <div>Coordinates: <span id="coords-val" class="hud-val">X: 0.000 | Y: 0.000</span></div>
        <div>Stream Rate: <span id="rate-val" class="hud-val">0 Hz</span></div>
    </div>
    
    <div id="indicator"></div>
    <div id="canvas-area"></div>
    <div id="instructions">Draw with S Pen or Stylus • 240Hz EMR Active</div>

    <script>
        const wsUrl = "ws://" + window.location.hostname + ":9877";
        let ws = null;
        const statusEl = document.getElementById("conn-status");
        const pressureEl = document.getElementById("pressure-val");
        const coordsEl = document.getElementById("coords-val");
        const rateEl = document.getElementById("rate-val");
        const indicator = document.getElementById("indicator");
        const canvasArea = document.getElementById("canvas-area");

        let eventCount = 0;
        let lastTimestamp = (new Date()).getTime();
        setInterval(() => {
            const currentTimestamp = (new Date()).getTime();
            const elapsed = currentTimestamp - lastTimestamp;
            if (elapsed > 0) {
                const hz = Math.round((eventCount * 1000) / elapsed);
                rateEl.textContent = `${hz} Hz`;
            }
            eventCount = 0;
            lastTimestamp = currentTimestamp;
        }, 1000);

        function connect() {
            ws = new WebSocket(wsUrl);
            ws.binaryType = "arraybuffer";
            ws.onopen = () => {
                statusEl.textContent = "Zero-Copy Turbo Active";
                statusEl.style.color = "#00e676";
            };
            ws.onclose = () => {
                statusEl.textContent = "Reconnecting...";
                statusEl.style.color = "#ff1744";
                setTimeout(connect, 1000);
            };
            ws.onerror = () => { ws.close(); };
        }
        connect();

        // Turbo Binary Packet: 12-byte packed format
        // [0..1] Magic 0xFACE, [2] Action, [3] Reserved, [4..5] uint16 normX, [6..7] uint16 normY, [8..9] uint16 pressure, [10] int8 tiltX, [11] int8 tiltY
        const packetBuf = new ArrayBuffer(12);
        const dataView = new DataView(packetBuf);
        dataView.setUint8(0, 0xFA);
        dataView.setUint8(1, 0xCE);

        let invWidth = 1 / window.innerWidth;
        let invHeight = 1 / window.innerHeight;
        window.addEventListener('resize', () => {
            invWidth = 1 / window.innerWidth;
            invHeight = 1 / window.innerHeight;
        });

        function dispatchPoint(e, actionCode) {
            const normX = Math.max(0, Math.min(1, e.clientX * invWidth));
            const normY = Math.max(0, Math.min(1, e.clientY * invHeight));
            const rawPressure = e.pressure > 0 ? e.pressure : (actionCode === 1 || actionCode === 2 ? 0.5 : 0.0);

            pressureEl.textContent = rawPressure.toFixed(3);
            coordsEl.textContent = `X: ${normX.toFixed(3)} | Y: ${normY.toFixed(3)}`;

            indicator.style.display = "block";
            indicator.style.left = e.clientX + "px";
            indicator.style.top = e.clientY + "px";
            const sz = 14 + rawPressure * 30;
            indicator.style.width = sz + "px";
            indicator.style.height = sz + "px";

            if (ws && ws.readyState === WebSocket.OPEN) {
                dataView.setUint8(2, actionCode);
                dataView.setUint16(4, (normX * 65535) | 0, true);
                dataView.setUint16(6, (normY * 65535) | 0, true);
                dataView.setUint16(8, (rawPressure * 65535) | 0, true);
                
                const tX = Math.max(-90, Math.min(90, e.tiltX || 0)) | 0;
                const tY = Math.max(-90, Math.min(90, e.tiltY || 0)) | 0;
                dataView.setInt8(10, tX);
                dataView.setInt8(11, tY);

                ws.send(packetBuf);
                eventCount++;
            }
        }

        canvasArea.addEventListener("pointerdown", (e) => {
            canvasArea.setPointerCapture(e.pointerId);
            dispatchPoint(e, 1);
        }, { passive: false });

        canvasArea.addEventListener("pointermove", (e) => {
            if (e.getCoalescedEvents) {
                const coalesced = e.getCoalescedEvents();
                const len = coalesced.length;
                if (len > 0) {
                    const act = e.buttons > 0 ? 2 : 0;
                    for (let i = 0; i < len; i++) {
                        dispatchPoint(coalesced[i], act);
                    }
                    return;
                }
            }
            dispatchPoint(e, e.buttons > 0 ? 2 : 0);
        }, { passive: false });

        canvasArea.addEventListener("pointerup", (e) => {
            dispatchPoint(e, 3);
            indicator.style.display = "none";
        }, { passive: false });

        canvasArea.addEventListener("pointercancel", (e) => {
            dispatchPoint(e, 3);
            indicator.style.display = "none";
        }, { passive: false });

        document.addEventListener("contextmenu", e => e.preventDefault());
    </script>
</body>
</html>
