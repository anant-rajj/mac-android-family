<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Family Continuity • S Pen & Universal Clipboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #0a0b0d; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        #canvas-area { width: 100vw; height: 100vh; touch-action: none; position: relative; background: radial-gradient(circle at center, #15161c 0%, #07080a 100%); }
        
        #hud { position: absolute; top: 16px; left: 16px; font-size: 13px; color: #888; pointer-events: none; z-index: 10; line-height: 1.5; background: rgba(0,0,0,0.65); padding: 10px 16px; border-radius: 10px; backdrop-filter: blur(10px); border: 1px solid rgba(0,229,255,0.2); }
        .hud-val { color: #00e5ff; font-weight: bold; font-family: monospace; }
        #indicator { position: absolute; border: 2px solid #00e5ff; border-radius: 50%; pointer-events: none; display: none; transform: translate(-50%, -50%); box-shadow: 0 0 15px rgba(0,229,255,0.5); will-change: transform, left, top; }
        
        /* Floating Universal Clipboard Card */
        #clipboard-card {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100vw - 32px);
            max-width: 480px;
            background: rgba(18, 20, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px 16px;
            backdrop-filter: blur(16px);
            z-index: 20;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .clip-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .clip-status { color: #00e676; font-size: 11px; }
        .clip-input-row {
            display: flex;
            gap: 8px;
        }
        #clip-text {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }
        #clip-text:focus { border-color: #00e5ff; }
        .clip-btn {
            background: #00e5ff;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .clip-btn:active { opacity: 0.7; }
        .clip-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div>Link: <span id="conn-status" class="hud-val">Connecting...</span></div>
        <div>S Pen Pressure: <span id="pressure-val" class="hud-val">0.000</span></div>
        <div>Coords: <span id="coords-val" class="hud-val">X: 0.000 | Y: 0.000</span></div>
        <div>Stream Rate: <span id="rate-val" class="hud-val">0 Hz</span></div>
    </div>
    
    <div id="indicator"></div>
    <div id="canvas-area"></div>

    <!-- Universal Clipboard UI Floating Card -->
    <div id="clipboard-card">
        <div class="clip-header">
            <span>📋 Universal Clipboard</span>
            <span id="clip-sync-badge" class="clip-status">Mac Synced</span>
        </div>
        <div class="clip-input-row">
            <input type="text" id="clip-text" placeholder="Type or paste to send to Mac pasteboard..." />
            <button class="clip-btn" id="send-btn">Send</button>
            <button class="clip-btn secondary" id="paste-btn">Paste</button>
        </div>
    </div>

    <script>
        const wsUrl = "ws://" + window.location.hostname + ":9877";
        let ws = null;
        const statusEl = document.getElementById("conn-status");
        const pressureEl = document.getElementById("pressure-val");
        const coordsEl = document.getElementById("coords-val");
        const rateEl = document.getElementById("rate-val");
        const indicator = document.getElementById("indicator");
        const canvasArea = document.getElementById("canvas-area");
        
        const clipInput = document.getElementById("clip-text");
        const sendBtn = document.getElementById("send-btn");
        const pasteBtn = document.getElementById("paste-btn");
        const clipBadge = document.getElementById("clip-sync-badge");

        let eventCount = 0;
        let lastTime = performance.now();
        setInterval(() => {
            const now = performance.now();
            const hz = Math.round((eventCount * 1000) / (now - lastTime));
            rateEl.textContent = `${hz} Hz`;
            eventCount = 0;
            lastTime = now;
        }, 1000);

        function connect() {
            ws = new WebSocket(wsUrl);
            ws.binaryType = "arraybuffer";
            ws.onopen = () => {
                statusEl.textContent = "Zero-Copy Turbo Active ✅";
                statusEl.style.color = "#00e676";
            };
            ws.onclose = () => {
                statusEl.textContent = "Reconnecting...";
                statusEl.style.color = "#ff1744";
                setTimeout(connect, 1000);
            };
            ws.onerror = () => { ws.close(); };
            
            // Listen for incoming clipboard broadcasts from Mac
            ws.onmessage = (event) => {
                if (typeof event.data === "string") {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === "clipboard_sync") {
                            clipInput.value = msg.text;
                            clipBadge.textContent = "Received from Mac! 📋";
                            clipBadge.style.color = "#00e5ff";
                            setTimeout(() => {
                                clipBadge.textContent = "Mac Synced";
                                clipBadge.style.color = "#00e676";
                            }, 3000);
                        }
                    } catch(e) {}
                }
            };
        }
        connect();

        // 1. Send text from Phone -> Mac
        sendBtn.addEventListener("click", () => {
            const text = clipInput.value;
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type: "clipboard_push", text: text }));
            clipBadge.textContent = "Sent to Mac! 🚀";
            clipBadge.style.color = "#00e5ff";
            setTimeout(() => {
                clipBadge.textContent = "Mac Synced";
                clipBadge.style.color = "#00e676";
            }, 2000);
        });

        // 2. Read phone clipboard and send to Mac
        pasteBtn.addEventListener("click", async () => {
            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    clipInput.value = text;
                    sendBtn.click();
                }
            } catch (err) {
                clipInput.focus();
                document.execCommand('paste');
            }
        });

        // S Pen Digitizer Fast-Path Binary Packet (12 bytes)
        const packetBuf = new ArrayBuffer(12);
        const dataView = new DataView(packetBuf);
        dataView.setUint8(0, 0xFA);
        dataView.setUint8(1, 0xCE);

        let invWidth = 1 / window.innerWidth;
        let invHeight = 1 / window.innerHeight;
        window.addEventListener('resize', () => {
            invWidth = 1 / window.innerWidth;
            invHeight = 1 / window.innerHeight;
        });

        function dispatchPoint(e, actionCode) {
            const normX = Math.max(0, Math.min(1, e.clientX * invWidth));
            const normY = Math.max(0, Math.min(1, e.clientY * invHeight));
            const rawPressure = e.pressure > 0 ? e.pressure : (actionCode === 1 || actionCode === 2 ? 0.5 : 0.0);

            pressureEl.textContent = rawPressure.toFixed(3);
            coordsEl.textContent = `X: ${normX.toFixed(3)} | Y: ${normY.toFixed(3)}`;

            indicator.style.display = "block";
            indicator.style.left = e.clientX + "px";
            indicator.style.top = e.clientY + "px";
            const sz = 14 + rawPressure * 30;
            indicator.style.width = sz + "px";
            indicator.style.height = sz + "px";

            if (ws && ws.readyState === WebSocket.OPEN) {
                dataView.setUint8(2, actionCode);
                dataView.setUint16(4, (normX * 65535) | 0, true);
                dataView.setUint16(6, (normY * 65535) | 0, true);
                dataView.setUint16(8, (rawPressure * 65535) | 0, true);
                
                const tX = Math.max(-90, Math.min(90, e.tiltX || 0)) | 0;
                const tY = Math.max(-90, Math.min(90, e.tiltY || 0)) | 0;
                dataView.setInt8(10, tX);
                dataView.setInt8(11, tY);

                ws.send(packetBuf);
                eventCount++;
            }
        }

        canvasArea.addEventListener("pointerdown", (e) => {
            canvasArea.setPointerCapture(e.pointerId);
            dispatchPoint(e, 1);
        }, { passive: false });

        canvasArea.addEventListener("pointermove", (e) => {
            if (e.getCoalescedEvents) {
                const coalesced = e.getCoalescedEvents();
                const len = coalesced.length;
                if (len > 0) {
                    const act = e.buttons > 0 ? 2 : 0;
                    for (let i = 0; i < len; i++) {
                        dispatchPoint(coalesced[i], act);
                    }
                    return;
                }
            }
            dispatchPoint(e, e.buttons > 0 ? 2 : 0);
        }, { passive: false });

        canvasArea.addEventListener("pointerup", (e) => {
            dispatchPoint(e, 3);
            indicator.style.display = "none";
        }, { passive: false });

        canvasArea.addEventListener("pointercancel", (e) => {
            dispatchPoint(e, 3);
            indicator.style.display = "none";
        }, { passive: false });

        document.addEventListener("contextmenu", e => e.preventDefault());
    </script>
</body>
</html>
