<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Family Continuity • Universal Touchpad & S Pen Digitizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08090c;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior: none;
        }
        #canvas-area {
            width: 100vw;
            height: 100vh;
            touch-action: none;
            position: relative;
            background: radial-gradient(circle at center, #12151f 0%, #050608 100%);
            cursor: crosshair;
        }
        
        /* Floating Responsive HUD */
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 14px);
            left: env(safe-area-inset-left, 14px);
            margin-top: 10px;
            margin-left: 10px;
            font-size: 11px;
            color: #8892b0;
            pointer-events: auto;
            z-index: 20;
            line-height: 1.5;
            background: rgba(13, 16, 23, 0.85);
            padding: 10px 14px;
            border-radius: 12px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 229, 255, 0.22);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            max-width: 320px;
        }
        #hud.minimized .hud-details {
            display: none;
        }
        .hud-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
        }
        .hud-title {
            font-weight: 700;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-val {
            color: #00e5ff;
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        .hud-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 5px;
            font-weight: 800;
            text-transform: uppercase;
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }
        .hud-details {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pressure-bar-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .pressure-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e5ff, #00e676);
            transition: width 0.05s ease-out;
        }
        
        /* Floating Cursor & S Pen Hover Reticle */
        #indicator {
            position: absolute;
            border: 2px solid #00e5ff;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.6);
            will-change: transform, left, top;
        }
        #hover-reticle {
            position: absolute;
            width: 22px;
            height: 22px;
            border: 1.5px dashed #00e5ff;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
            animation: spin 10s linear infinite;
        }
        #hover-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ccff00;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ccff00;
        }
        @keyframes spin {
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Top Controls Bar (Mode & Display Selectors) */
        #controls-bar {
            position: absolute;
            top: env(safe-area-inset-top, 14px);
            right: env(safe-area-inset-right, 14px);
            margin-top: 10px;
            margin-right: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            z-index: 20;
        }
        .ctrl-btn {
            background: rgba(13, 16, 23, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 7px 12px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            outline: none;
        }
        .ctrl-btn:active {
            transform: scale(0.96);
            border-color: #00e5ff;
        }
        .ctrl-btn.active-mode {
            background: rgba(0, 229, 255, 0.15);
            border-color: #00e5ff;
            color: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
        }
        select.ctrl-btn {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 24px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300E5FF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 8px top 50%;
            background-size: 8px auto;
        }

        /* Bottom Click Bar */
        #bottom-bar {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 14px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
            pointer-events: auto;
        }
        .pad-btn {
            background: rgba(13, 16, 23, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d1d5db;
            font-size: 11px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .pad-btn:active {
            background: rgba(0, 229, 255, 0.25);
            border-color: #00e5ff;
            color: #00e5ff;
            transform: scale(0.95);
        }

        /* Bottom Instruction Bar */
        #instructions {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 14px) + 44px);
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            text-align: center;
            letter-spacing: 0.4px;
            width: 90%;
            max-width: 480px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-header" id="hud-toggle">
            <div class="hud-title">
                <span id="hud-icon">✏️</span>
                <span id="hud-mode-title">S Pen Engine Ready</span>
            </div>
            <span id="conn-badge" class="hud-badge">Connecting</span>
        </div>
        <div class="hud-details">
            <div class="hud-row">
                <span>Active Tool:</span>
                <span id="device-mode" class="hud-val">S Pen (EMR Digitizer)</span>
            </div>
            <div class="hud-row">
                <span>S Pen State:</span>
                <span id="spen-state" class="hud-val">Ready</span>
            </div>
            <div class="hud-row">
                <span>Display Target:</span>
                <span id="display-label" class="hud-val">Screen 1 (MacBook)</span>
            </div>
            <div class="hud-row">
                <span>Display Lock:</span>
                <span id="lock-status" class="hud-val" style="color: #00e676;">Clamped</span>
            </div>
            <div class="hud-row">
                <span>Pressure:</span>
                <span id="pressure-val" class="hud-val">0.000</span>
            </div>
            <div class="pressure-bar-track">
                <div id="pressure-bar" class="pressure-bar-fill"></div>
            </div>
            <div class="hud-row" style="margin-top: 4px;">
                <span>Coordinates:</span>
                <span id="coords-val" class="hud-val">0.000, 0.000</span>
            </div>
            <div class="hud-row">
                <span>Sampling Rate:</span>
                <span id="rate-val" class="hud-val">0 Hz</span>
            </div>
        </div>
    </div>

    <div id="controls-bar">
        <button class="ctrl-btn active-mode" id="mode-btn">✏️ S Pen / Tablet</button>
        <select class="ctrl-btn" id="screen-select">
            <option value="1">🖥️ Screen 1 (MacBook Air)</option>
            <option value="2">🖥️ Screen 2 (External 1)</option>
            <option value="3">🖥️ Screen 3 (External 2)</option>
            <option value="0">🌐 All Screens (Unconstrained)</option>
        </select>
        <button class="ctrl-btn" id="fs-btn">⛶ Fullscreen</button>
    </div>
    
    <div id="indicator"></div>
    <div id="hover-reticle"></div>
    <div id="hover-dot"></div>
    <div id="canvas-area"></div>

    <div id="instructions">Hover S Pen to move cursor • Touch glass to draw • Palm Rejection Active</div>

    <div id="bottom-bar">
        <button class="pad-btn" id="btn-left-click">Left Click</button>
        <button class="pad-btn" id="btn-right-click">Right Click</button>
    </div>

    <script>
        const wsUrl = "ws://" + window.location.hostname + ":9877";
        let ws = null;
        
        const badgeEl = document.getElementById("conn-badge");
        const deviceModeEl = document.getElementById("device-mode");
        const spenStateEl = document.getElementById("spen-state");
        const displayLabelEl = document.getElementById("display-label");
        const lockStatusEl = document.getElementById("lock-status");
        const pressureEl = document.getElementById("pressure-val");
        const pressureBar = document.getElementById("pressure-bar");
        const coordsEl = document.getElementById("coords-val");
        const rateEl = document.getElementById("rate-val");
        const indicator = document.getElementById("indicator");
        const hoverReticle = document.getElementById("hover-reticle");
        const hoverDot = document.getElementById("hover-dot");
        const canvasArea = document.getElementById("canvas-area");
        const hudEl = document.getElementById("hud");
        const hudToggle = document.getElementById("hud-toggle");
        const hudModeTitle = document.getElementById("hud-mode-title");
        const hudIcon = document.getElementById("hud-icon");
        const fsBtn = document.getElementById("fs-btn");
        const modeBtn = document.getElementById("mode-btn");
        const screenSelect = document.getElementById("screen-select");
        const instructionsEl = document.getElementById("instructions");
        const btnLeftClick = document.getElementById("btn-left-click");
        const btnRightClick = document.getElementById("btn-right-click");

        // Modes: "digitizer" (S Pen Absolute Tablet) or "touchpad" (Finger Relative Trackpad)
        let mode = "digitizer"; // Default to S Pen Tablet Mode for Galaxy S23 Ultra
        let selectedScreen = 1;  // Default to Screen 1 (MacBook)

        // S Pen Proximity & Palm Rejection State
        let isSpenInProximity = false;
        let lastSpenHoverTime = 0;

        // Toggle Finger Mode (S Pen ALWAYS uses Absolute mode regardless of this button!)
        modeBtn.addEventListener("click", () => {
            if (mode === "digitizer") {
                mode = "touchpad";
                modeBtn.textContent = "🖱️ Finger Trackpad";
                modeBtn.classList.remove("active-mode");
                hudModeTitle.textContent = "Trackpad Mode";
                hudIcon.textContent = "🖱️";
                instructionsEl.textContent = "Finger: Relative Trackpad • S Pen: Absolute Tablet + Hover";
            } else {
                mode = "digitizer";
                modeBtn.textContent = "✏️ S Pen / Tablet";
                modeBtn.classList.add("active-mode");
                hudModeTitle.textContent = "S Pen Tablet Mode";
                hudIcon.textContent = "✏️";
                instructionsEl.textContent = "Hover S Pen to move cursor • Touch glass to draw • Palm Rejection Active";
            }
        });

        // Screen Select change
        screenSelect.addEventListener("change", (e) => {
            selectedScreen = parseInt(e.target.value, 10);
            const selText = screenSelect.options[screenSelect.selectedIndex].text;
            displayLabelEl.textContent = selText;
            if (selectedScreen === 0) {
                lockStatusEl.textContent = "Unconstrained";
                lockStatusEl.style.color = "#f59e0b";
            } else {
                lockStatusEl.textContent = `Clamped to Screen ${selectedScreen}`;
                lockStatusEl.style.color = "#00e676";
            }
        });

        // Minimize / Expand HUD on tap
        hudToggle.addEventListener("click", () => {
            hudEl.classList.toggle("minimized");
        });

        // Fullscreen toggle
        fsBtn.addEventListener("click", () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                fsBtn.textContent = "✕ Exit";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fsBtn.textContent = "⛶ Fullscreen";
                }
            }
        });

        // Frequency Calculation
        let eventCount = 0;
        let lastTimestamp = (new Date()).getTime();
        setInterval(() => {
            const currentTimestamp = (new Date()).getTime();
            const elapsed = currentTimestamp - lastTimestamp;
            if (elapsed > 0) {
                const hz = Math.round((eventCount * 1000) / elapsed);
                rateEl.textContent = `${hz} Hz`;
            }
            eventCount = 0;
            lastTimestamp = currentTimestamp;
        }, 1000);

        function connect() {
            ws = new WebSocket(wsUrl);
            ws.binaryType = "arraybuffer";
            ws.onopen = () => {
                badgeEl.textContent = "Online";
                badgeEl.style.background = "rgba(0, 230, 118, 0.15)";
                badgeEl.style.color = "#00e676";
                badgeEl.style.borderColor = "rgba(0, 230, 118, 0.3)";
            };
            ws.onmessage = (event) => {
                if (typeof event.data === "string") {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === "init" && Array.isArray(msg.displays)) {
                            screenSelect.innerHTML = "";
                            msg.displays.forEach(d => {
                                const opt = document.createElement("option");
                                opt.value = d.index;
                                opt.textContent = `🖥️ ${d.name} (${d.width}x${d.height})`;
                                screenSelect.appendChild(opt);
                            });
                            const allOpt = document.createElement("option");
                            allOpt.value = 0;
                            allOpt.textContent = "🌐 All Screens (Unconstrained)";
                            screenSelect.appendChild(allOpt);
                            selectedScreen = msg.displays[0]?.index || 1;
                            displayLabelEl.textContent = msg.displays[0]?.name || "Screen 1";
                        }
                    } catch (e) {}
                }
            };
            ws.onclose = () => {
                badgeEl.textContent = "Offline";
                badgeEl.style.background = "rgba(255, 23, 68, 0.15)";
                badgeEl.style.color = "#ff1744";
                badgeEl.style.borderColor = "rgba(255, 23, 68, 0.3)";
                setTimeout(connect, 1000);
            };
            ws.onerror = () => { ws.close(); };
        }
        connect();

        // 12-byte packed turbo binary packet layout:
        // [0..1] Magic 0xFACE
        // [2] Action: 0=HoverMove, 1=Down, 2=Move/Drag, 3=Up, 4=Scroll, 5=RightClick, 6=HoverEnter, 7=HoverExit
        // [3] Flags: (isRelative ? 0x80 : 0x00) | (screenIndex & 0x7F)
        // [4..5] int16 deltaX (Relative) OR uint16 normX (Absolute)
        // [6..7] int16 deltaY (Relative) OR uint16 normY (Absolute)
        // [8..9] uint16 pressure
        // [10] int8 tiltX
        // [11] int8 tiltY
        const packetBuf = new ArrayBuffer(12);
        const dataView = new DataView(packetBuf);
        dataView.setUint8(0, 0xFA);
        dataView.setUint8(1, 0xCE);

        let invWidth = 1 / window.innerWidth;
        let invHeight = 1 / window.innerHeight;
        window.addEventListener('resize', () => {
            invWidth = 1 / window.innerWidth;
            invHeight = 1 / window.innerHeight;
        });

        function sendPacket(actionCode, valX, valY, rawPressure, tiltX, tiltY, isRel) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            const flags = (isRel ? 0x80 : 0x00) | (selectedScreen & 0x7F);

            dataView.setUint8(2, actionCode);
            dataView.setUint8(3, flags);

            if (isRel) {
                const clampedDX = Math.max(-32767, Math.min(32767, Math.round(valX)));
                const clampedDY = Math.max(-32767, Math.min(32767, Math.round(valY)));
                dataView.setInt16(4, clampedDX, true);
                dataView.setInt16(6, clampedDY, true);
            } else {
                dataView.setUint16(4, (valX * 65535) | 0, true);
                dataView.setUint16(6, (valY * 65535) | 0, true);
            }

            dataView.setUint16(8, (rawPressure * 65535) | 0, true);
            dataView.setInt8(10, Math.max(-90, Math.min(90, tiltX || 0)) | 0);
            dataView.setInt8(11, Math.max(-90, Math.min(90, tiltY || 0)) | 0);

            ws.send(packetBuf);
            eventCount++;
        }

        // State variables for finger relative mode
        let fingerAnchorX = 0;
        let fingerAnchorY = 0;
        let fingerTouchStartTime = 0;
        let fingerTotalDisplacement = 0;
        let activeFingerPointers = new Map();

        // 1. S PEN HOVER & MOVEMENT (Continuous capture without requiring touch-down!)
        window.addEventListener("pointermove", (e) => {
            const isStylus = (e.pointerType === "pen");

            if (isStylus) {
                // S Pen Detected: STRICT ABSOLUTE GRAPHICS TABLET MODE
                isSpenInProximity = true;
                lastSpenHoverTime = Date.now();
                deviceModeEl.textContent = "S Pen (EMR Digitizer)";

                const normX = Math.max(0, Math.min(1, e.clientX * invWidth));
                const normY = Math.max(0, Math.min(1, e.clientY * invHeight));

                if (e.buttons === 0) {
                    // STATE A: HOVERING (S Pen tip is in air, pressure is ZERO, cursor tracks on Mac!)
                    spenStateEl.textContent = "Hover Tracking";
                    spenStateEl.style.color = "#00e5ff";
                    pressureEl.textContent = "0.000";
                    pressureBar.style.width = "0%";
                    coordsEl.textContent = `${normX.toFixed(3)}, ${normY.toFixed(3)}`;

                    // Send Action 0 (HOVER_MOVE) with pressure=0, Absolute positioning
                    sendPacket(0, normX, normY, 0.0, e.tiltX, e.tiltY, false);

                    // Visual feedback: Samsung Air Command reticle
                    hoverReticle.style.display = "block";
                    hoverReticle.style.left = e.clientX + "px";
                    hoverReticle.style.top = e.clientY + "px";
                    hoverDot.style.display = "block";
                    hoverDot.style.left = e.clientX + "px";
                    hoverDot.style.top = e.clientY + "px";
                    indicator.style.display = "none";
                } else {
                    // STATE C: PEN CONTACT DRAWING (Physical touch, pressure > 0)
                    spenStateEl.textContent = "Active Drawing";
                    spenStateEl.style.color = "#00e676";
                    const pressure = e.pressure > 0 ? e.pressure : 0.5;
                    pressureEl.textContent = pressure.toFixed(3);
                    pressureBar.style.width = `${(pressure * 100).toFixed(0)}%`;
                    coordsEl.textContent = `${normX.toFixed(3)}, ${normY.toFixed(3)}`;

                    // Send Action 2 (MOVE) with actual hardware pressure
                    sendPacket(2, normX, normY, pressure, e.tiltX, e.tiltY, false);

                    // Visual drawing feedback
                    hoverReticle.style.display = "none";
                    hoverDot.style.display = "none";
                    indicator.style.display = "block";
                    indicator.style.left = e.clientX + "px";
                    indicator.style.top = e.clientY + "px";
                    indicator.style.width = (12 + pressure * 28) + "px";
                    indicator.style.height = (12 + pressure * 28) + "px";
                }
                return;
            }

            // Non-Stylus (Finger / Palm Touch Event)
            // PALM REJECTION: Drop all finger events if S Pen is hovering or was active recently!
            if (isSpenInProximity && (Date.now() - lastSpenHoverTime < 600)) {
                return; // 100% Palm Rejection
            }

            // Ordinary Finger Trackpad logic
            if (activeFingerPointers.has(e.pointerId)) {
                deviceModeEl.textContent = "Finger Touch";
                spenStateEl.textContent = "Trackpad Active";
                spenStateEl.style.color = "#94a3b8";

                const prev = activeFingerPointers.get(e.pointerId);

                if (activeFingerPointers.size === 2) {
                    // Two-finger scroll
                    const scrollDY = -(e.clientY - prev.y) * 1.5;
                    const scrollDX = (e.clientX - prev.x) * 1.5;
                    sendPacket(4, scrollDX, scrollDY, 0, 0, 0, true);
                    activeFingerPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    coordsEl.textContent = `Scroll Δ ${scrollDY | 0}`;
                    return;
                }

                if (mode === "touchpad") {
                    const rawDX = e.clientX - fingerAnchorX;
                    const rawDY = e.clientY - fingerAnchorY;
                    fingerTotalDisplacement += Math.hypot(rawDX, rawDY);

                    const speed = Math.hypot(rawDX, rawDY);
                    const accel = Math.min(2.8, 1.0 + (speed * 0.04));
                    const deltaX = rawDX * accel;
                    const deltaY = rawDY * accel;

                    const isDrag = (e.buttons > 0 && fingerTotalDisplacement > 15);
                    const actCode = isDrag ? 2 : 0;
                    sendPacket(actCode, deltaX, deltaY, isDrag ? 0.6 : 0.0, e.tiltX, e.tiltY, true);

                    fingerAnchorX = e.clientX;
                    fingerAnchorY = e.clientY;
                    activeFingerPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                    coordsEl.textContent = `Δ ${deltaX > 0 ? '+' : ''}${deltaX.toFixed(1)}, ${deltaY > 0 ? '+' : ''}${deltaY.toFixed(1)}`;
                } else {
                    // Finger in digitizer mode
                    const normX = Math.max(0, Math.min(1, e.clientX * invWidth));
                    const normY = Math.max(0, Math.min(1, e.clientY * invHeight));
                    sendPacket(2, normX, normY, 0.5, e.tiltX, e.tiltY, false);
                    coordsEl.textContent = `${normX.toFixed(3)}, ${normY.toFixed(3)}`;
                }

                indicator.style.display = "block";
                indicator.style.left = e.clientX + "px";
                indicator.style.top = e.clientY + "px";
                indicator.style.width = "20px";
                indicator.style.height = "20px";
            }
        }, { passive: false });

        // 2. POINTER DOWN (Physical contact begins)
        canvasArea.addEventListener("pointerdown", (e) => {
            canvasArea.setPointerCapture(e.pointerId);
            const isStylus = (e.pointerType === "pen");

            if (isStylus) {
                // STATE B: S PEN CONTACT (Seamless transition from hover to pen-down with ZERO jump!)
                isSpenInProximity = true;
                lastSpenHoverTime = Date.now();
                const normX = Math.max(0, Math.min(1, e.clientX * invWidth));
                const normY = Math.max(0, Math.min(1, e.clientY * invHeight));
                const pressure = e.pressure > 0 ? e.pressure : 0.5;

                spenStateEl.textContent = "Contact Down";
                spenStateEl.style.color = "#00e676";
                pressureEl.textContent = pressure.toFixed(3);
                pressureBar.style.width = `${(pressure * 100).toFixed(0)}%`;

                // Action 1 (DOWN): Begin drawing at current hover position!
                sendPacket(1, normX, normY, pressure, e.tiltX, e.tiltY, false);

                hoverReticle.style.display = "none";
                hoverDot.style.display = "none";
                indicator.style.display = "block";
                indicator.style.left = e.clientX + "px";
                indicator.style.top = e.clientY + "px";
                return;
            }

            // Finger touch down
            if (isSpenInProximity && (Date.now() - lastSpenHoverTime < 600)) {
                return; // Palm Rejection
            }

            activeFingerPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            fingerAnchorX = e.clientX;
            fingerAnchorY = e.clientY;
            fingerTouchStartTime = Date.now();
            fingerTotalDisplacement = 0;

            if (mode === "digitizer") {
                const normX = Math.max(0, Math.min(1, e.clientX * invWidth));
                const normY = Math.max(0, Math.min(1, e.clientY * invHeight));
                sendPacket(1, normX, normY, 0.5, e.tiltX, e.tiltY, false);
            }
        }, { passive: false });

        // 3. POINTER UP (Contact ends, transition back to hover if pen remains near glass)
        const handlePointerEnd = (e) => {
            const isStylus = (e.pointerType === "pen");

            if (isStylus) {
                // STATE D: PEN RELEASE (Stroke terminates immediately; hover tracking resumes!)
                const normX = Math.max(0, Math.min(1, e.clientX * invWidth));
                const normY = Math.max(0, Math.min(1, e.clientY * invHeight));

                spenStateEl.textContent = "Pen Released (Hovering)";
                spenStateEl.style.color = "#00e5ff";
                pressureEl.textContent = "0.000";
                pressureBar.style.width = "0%";

                // Action 3 (UP): End drawing stroke
                sendPacket(3, normX, normY, 0.0, e.tiltX, e.tiltY, false);

                // Show hover reticle again
                hoverReticle.style.display = "block";
                hoverReticle.style.left = e.clientX + "px";
                hoverReticle.style.top = e.clientY + "px";
                hoverDot.style.display = "block";
                hoverDot.style.left = e.clientX + "px";
                hoverDot.style.top = e.clientY + "px";
                indicator.style.display = "none";
                return;
            }

            // Finger up logic
            activeFingerPointers.delete(e.pointerId);
            if (mode === "touchpad") {
                const duration = Date.now() - fingerTouchStartTime;
                if (duration < 240 && fingerTotalDisplacement < 10) {
                    sendPacket(1, 0, 0, 1.0, 0, 0, true);
                    setTimeout(() => sendPacket(3, 0, 0, 0.0, 0, 0, true), 40);
                    coordsEl.textContent = "Tap: Click!";
                } else {
                    sendPacket(3, 0, 0, 0.0, 0, 0, true);
                }
            } else {
                sendPacket(3, 0, 0, 0.0, 0, 0, false);
            }

            if (activeFingerPointers.size === 0) {
                indicator.style.display = "none";
                pressureBar.style.width = "0%";
                pressureEl.textContent = "0.000";
            }
        };

        canvasArea.addEventListener("pointerup", handlePointerEnd, { passive: false });
        canvasArea.addEventListener("pointercancel", handlePointerEnd, { passive: false });

        // 4. S PEN HOVER EXIT (Pen leaves hover detection range)
        window.addEventListener("pointerout", (e) => {
            if (e.pointerType === "pen") {
                isSpenInProximity = false;
                spenStateEl.textContent = "Outside Range";
                spenStateEl.style.color = "#64748b";
                hoverReticle.style.display = "none";
                hoverDot.style.display = "none";
                indicator.style.display = "none";

                const normX = Math.max(0, Math.min(1, e.clientX * invWidth));
                const normY = Math.max(0, Math.min(1, e.clientY * invHeight));
                // Action 7 (HOVER_EXIT): Tells Mac S Pen left proximity
                sendPacket(7, normX, normY, 0.0, 0, 0, false);
            }
        });

        // Bottom click buttons
        btnLeftClick.addEventListener("pointerdown", () => sendPacket(1, 0, 0, 1.0, 0, 0, true));
        btnLeftClick.addEventListener("pointerup", () => sendPacket(3, 0, 0, 0.0, 0, 0, true));
        btnRightClick.addEventListener("pointerdown", () => sendPacket(5, 0, 0, 1.0, 0, 0, true));

        // Prevent browser default zoom & gestures
        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("touchmove", e => { if (e.scale !== 1) e.preventDefault(); }, { passive: false });
    </script>
</body>
</html>
