<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Family Continuity • Universal Touchpad & Digitizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #08090c;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior: none;
        }
        #canvas-area {
            width: 100vw;
            height: 100vh;
            touch-action: none;
            position: relative;
            background: radial-gradient(circle at center, #12151f 0%, #050608 100%);
            cursor: default;
        }
        
        /* Floating Responsive HUD */
        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 14px);
            left: env(safe-area-inset-left, 14px);
            margin-top: 10px;
            margin-left: 10px;
            font-size: 11px;
            color: #8892b0;
            pointer-events: auto;
            z-index: 20;
            line-height: 1.5;
            background: rgba(13, 16, 23, 0.82);
            padding: 10px 14px;
            border-radius: 12px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 229, 255, 0.22);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            max-width: 300px;
        }
        #hud.minimized .hud-details {
            display: none;
        }
        .hud-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
        }
        .hud-title {
            font-weight: 700;
            color: #fff;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .hud-val {
            color: #00e5ff;
            font-weight: 700;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        .hud-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 5px;
            font-weight: 800;
            text-transform: uppercase;
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }
        .hud-details {
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pressure-bar-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .pressure-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e5ff, #00e676);
            transition: width 0.05s ease-out;
        }
        
        /* Floating Cursor Feedback */
        #indicator {
            position: absolute;
            border: 2px solid #00e5ff;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.5);
            will-change: transform, left, top;
        }

        /* Top Controls Bar (Mode & Display Selectors) */
        #controls-bar {
            position: absolute;
            top: env(safe-area-inset-top, 14px);
            right: env(safe-area-inset-right, 14px);
            margin-top: 10px;
            margin-right: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
            z-index: 20;
        }
        .ctrl-btn {
            background: rgba(13, 16, 23, 0.85);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 7px 12px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
            outline: none;
        }
        .ctrl-btn:active {
            transform: scale(0.96);
            border-color: #00e5ff;
        }
        .ctrl-btn.active-mode {
            background: rgba(0, 229, 255, 0.15);
            border-color: #00e5ff;
            color: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
        }
        select.ctrl-btn {
            appearance: none;
            -webkit-appearance: none;
            padding-right: 24px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300E5FF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 8px top 50%;
            background-size: 8px auto;
        }

        /* Bottom Click Bar (Optional trackpad buttons) */
        #bottom-bar {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 14px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
            pointer-events: auto;
        }
        .pad-btn {
            background: rgba(13, 16, 23, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d1d5db;
            font-size: 11px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .pad-btn:active {
            background: rgba(0, 229, 255, 0.25);
            border-color: #00e5ff;
            color: #00e5ff;
            transform: scale(0.95);
        }

        /* Bottom Instruction Bar */
        #instructions {
            position: absolute;
            bottom: calc(env(safe-area-inset-bottom, 14px) + 44px);
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            text-align: center;
            letter-spacing: 0.4px;
            width: 90%;
            max-width: 480px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div class="hud-header" id="hud-toggle">
            <div class="hud-title">
                <span id="hud-icon">🖱️</span>
                <span id="hud-mode-title">Trackpad Active</span>
            </div>
            <span id="conn-badge" class="hud-badge">Connecting</span>
        </div>
        <div class="hud-details">
            <div class="hud-row">
                <span>Input Mode:</span>
                <span id="device-mode" class="hud-val">Touchpad (Relative)</span>
            </div>
            <div class="hud-row">
                <span>Display Target:</span>
                <span id="display-label" class="hud-val">Screen 1 (MacBook)</span>
            </div>
            <div class="hud-row">
                <span>Display Lock:</span>
                <span id="lock-status" class="hud-val" style="color: #00e676;">Clamped (Locked)</span>
            </div>
            <div class="hud-row">
                <span>Pressure:</span>
                <span id="pressure-val" class="hud-val">0.000</span>
            </div>
            <div class="pressure-bar-track">
                <div id="pressure-bar" class="pressure-bar-fill"></div>
            </div>
            <div class="hud-row" style="margin-top: 4px;">
                <span>Movement:</span>
                <span id="coords-val" class="hud-val">Δ 0, 0</span>
            </div>
            <div class="hud-row">
                <span>Sampling Rate:</span>
                <span id="rate-val" class="hud-val">0 Hz</span>
            </div>
        </div>
    </div>

    <div id="controls-bar">
        <button class="ctrl-btn active-mode" id="mode-btn">🖱️ Touchpad</button>
        <select class="ctrl-btn" id="screen-select">
            <option value="1">🖥️ Screen 1 (MacBook Air)</option>
            <option value="2">🖥️ Screen 2 (External 1)</option>
            <option value="3">🖥️ Screen 3 (External 2)</option>
            <option value="0">🌐 All Screens (Unconstrained)</option>
        </select>
        <button class="ctrl-btn" id="fs-btn">⛶ Fullscreen</button>
    </div>
    
    <div id="indicator"></div>
    <div id="canvas-area"></div>

    <div id="instructions">Glide finger anywhere to move cursor • Tap to click • Two-finger scroll</div>

    <div id="bottom-bar">
        <button class="pad-btn" id="btn-left-click">Left Click</button>
        <button class="pad-btn" id="btn-right-click">Right Click</button>
    </div>

    <script>
        const wsUrl = "ws://" + window.location.hostname + ":9877";
        let ws = null;
        
        const badgeEl = document.getElementById("conn-badge");
        const deviceModeEl = document.getElementById("device-mode");
        const displayLabelEl = document.getElementById("display-label");
        const lockStatusEl = document.getElementById("lock-status");
        const pressureEl = document.getElementById("pressure-val");
        const pressureBar = document.getElementById("pressure-bar");
        const coordsEl = document.getElementById("coords-val");
        const rateEl = document.getElementById("rate-val");
        const indicator = document.getElementById("indicator");
        const canvasArea = document.getElementById("canvas-area");
        const hudEl = document.getElementById("hud");
        const hudToggle = document.getElementById("hud-toggle");
        const hudModeTitle = document.getElementById("hud-mode-title");
        const hudIcon = document.getElementById("hud-icon");
        const fsBtn = document.getElementById("fs-btn");
        const modeBtn = document.getElementById("mode-btn");
        const screenSelect = document.getElementById("screen-select");
        const instructionsEl = document.getElementById("instructions");
        const btnLeftClick = document.getElementById("btn-left-click");
        const btnRightClick = document.getElementById("btn-right-click");

        // Modes: "touchpad" (Relative displacement, no jumping) or "digitizer" (Absolute 1:1 mapping)
        let mode = "touchpad"; // Default to Touchpad mode as requested!
        let selectedScreen = 1; // Default to Screen 1

        // Toggle Mode
        modeBtn.addEventListener("click", () => {
            if (mode === "touchpad") {
                mode = "digitizer";
                modeBtn.textContent = "✏️ Digitizer";
                modeBtn.classList.remove("active-mode");
                hudModeTitle.textContent = "Digitizer Active";
                hudIcon.textContent = "✏️";
                deviceModeEl.textContent = "Digitizer (Absolute)";
                instructionsEl.textContent = "1:1 Screen Mapping • Draw with S Pen, Apple Pencil or Stylus";
            } else {
                mode = "touchpad";
                modeBtn.textContent = "🖱️ Touchpad";
                modeBtn.classList.add("active-mode");
                hudModeTitle.textContent = "Trackpad Active";
                hudIcon.textContent = "🖱️";
                deviceModeEl.textContent = "Touchpad (Relative)";
                instructionsEl.textContent = "Glide finger anywhere to move cursor • Tap to click • Two-finger scroll";
            }
        });

        // Screen Select change
        screenSelect.addEventListener("change", (e) => {
            selectedScreen = parseInt(e.target.value, 10);
            const selText = screenSelect.options[screenSelect.selectedIndex].text;
            displayLabelEl.textContent = selText;
            if (selectedScreen === 0) {
                lockStatusEl.textContent = "Unconstrained";
                lockStatusEl.style.color = "#f59e0b";
            } else {
                lockStatusEl.textContent = `Clamped to Screen ${selectedScreen}`;
                lockStatusEl.style.color = "#00e676";
            }
        });

        // Minimize / Expand HUD on tap
        hudToggle.addEventListener("click", () => {
            hudEl.classList.toggle("minimized");
        });

        // Fullscreen toggle
        fsBtn.addEventListener("click", () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                fsBtn.textContent = "✕ Exit";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fsBtn.textContent = "⛶ Fullscreen";
                }
            }
        });

        // Bottom click buttons
        btnLeftClick.addEventListener("pointerdown", () => {
            sendPacket(1, 0, 0, 1.0, 0, 0); // Down
        });
        btnLeftClick.addEventListener("pointerup", () => {
            sendPacket(3, 0, 0, 0.0, 0, 0); // Up
        });
        btnRightClick.addEventListener("pointerdown", () => {
            sendPacket(5, 0, 0, 1.0, 0, 0); // Right Click
        });

        // Frequency Calculation
        let eventCount = 0;
        let lastTimestamp = (new Date()).getTime();
        setInterval(() => {
            const currentTimestamp = (new Date()).getTime();
            const elapsed = currentTimestamp - lastTimestamp;
            if (elapsed > 0) {
                const hz = Math.round((eventCount * 1000) / elapsed);
                rateEl.textContent = `${hz} Hz`;
            }
            eventCount = 0;
            lastTimestamp = currentTimestamp;
        }, 1000);

        function connect() {
            ws = new WebSocket(wsUrl);
            ws.binaryType = "arraybuffer";
            ws.onopen = () => {
                badgeEl.textContent = "Online";
                badgeEl.style.background = "rgba(0, 230, 118, 0.15)";
                badgeEl.style.color = "#00e676";
                badgeEl.style.borderColor = "rgba(0, 230, 118, 0.3)";
            };
            ws.onmessage = (event) => {
                // Handle initial display metadata from bridge_server.py
                if (typeof event.data === "string") {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === "init" && Array.isArray(msg.displays)) {
                            screenSelect.innerHTML = "";
                            msg.displays.forEach(d => {
                                const opt = document.createElement("option");
                                opt.value = d.index;
                                opt.textContent = `🖥️ ${d.name} (${d.width}x${d.height})`;
                                screenSelect.appendChild(opt);
                            });
                            const allOpt = document.createElement("option");
                            allOpt.value = 0;
                            allOpt.textContent = "🌐 All Screens (Unconstrained)";
                            screenSelect.appendChild(allOpt);
                            selectedScreen = msg.displays[0]?.index || 1;
                            displayLabelEl.textContent = msg.displays[0]?.name || "Screen 1";
                        }
                    } catch (e) {}
                }
            };
            ws.onclose = () => {
                badgeEl.textContent = "Offline";
                badgeEl.style.background = "rgba(255, 23, 68, 0.15)";
                badgeEl.style.color = "#ff1744";
                badgeEl.style.borderColor = "rgba(255, 23, 68, 0.3)";
                setTimeout(connect, 1000);
            };
            ws.onerror = () => { ws.close(); };
        }
        connect();

        // 12-byte packed turbo binary packet layout:
        // [0..1] Magic 0xFACE
        // [2] Action: 0=Hover, 1=Down, 2=Move/Drag, 3=Up, 4=Scroll, 5=RightClick
        // [3] Flags: (isRelative ? 0x80 : 0x00) | (screenIndex & 0x7F)
        // [4..5] int16 deltaX (Relative) OR uint16 normX (Absolute)
        // [6..7] int16 deltaY (Relative) OR uint16 normY (Absolute)
        // [8..9] uint16 pressure
        // [10] int8 tiltX
        // [11] int8 tiltY
        const packetBuf = new ArrayBuffer(12);
        const dataView = new DataView(packetBuf);
        dataView.setUint8(0, 0xFA);
        dataView.setUint8(1, 0xCE);

        let invWidth = 1 / window.innerWidth;
        let invHeight = 1 / window.innerHeight;
        window.addEventListener('resize', () => {
            invWidth = 1 / window.innerWidth;
            invHeight = 1 / window.innerHeight;
        });

        function sendPacket(actionCode, valX, valY, rawPressure, tiltX, tiltY) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            const isRel = (mode === "touchpad");
            const flags = (isRel ? 0x80 : 0x00) | (selectedScreen & 0x7F);

            dataView.setUint8(2, actionCode);
            dataView.setUint8(3, flags);

            if (isRel) {
                // Signed 16-bit integer pixel displacement
                const clampedDX = Math.max(-32767, Math.min(32767, Math.round(valX)));
                const clampedDY = Math.max(-32767, Math.min(32767, Math.round(valY)));
                dataView.setInt16(4, clampedDX, true);
                dataView.setInt16(6, clampedDY, true);
            } else {
                // Normalized 16-bit unsigned coordinate [0..65535]
                dataView.setUint16(4, (valX * 65535) | 0, true);
                dataView.setUint16(6, (valY * 65535) | 0, true);
            }

            dataView.setUint16(8, (rawPressure * 65535) | 0, true);
            dataView.setInt8(10, Math.max(-90, Math.min(90, tiltX || 0)) | 0);
            dataView.setInt8(11, Math.max(-90, Math.min(90, tiltY || 0)) | 0);

            ws.send(packetBuf);
            eventCount++;
        }

        // Touchpad Relative State Management
        let anchorX = 0;
        let anchorY = 0;
        let touchStartTime = 0;
        let totalDisplacement = 0;
        let activePointers = new Map();

        // Pointer event listeners
        canvasArea.addEventListener("pointerdown", (e) => {
            canvasArea.setPointerCapture(e.pointerId);
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (mode === "touchpad") {
                // Touchpad: Anchor position without moving cursor!
                anchorX = e.clientX;
                anchorY = e.clientY;
                touchStartTime = Date.now();
                totalDisplacement = 0;

                // Visual Indicator
                indicator.style.display = "block";
                indicator.style.left = e.clientX + "px";
                indicator.style.top = e.clientY + "px";
                indicator.style.width = "24px";
                indicator.style.height = "24px";

                coordsEl.textContent = `Anchor @ ${e.clientX | 0}, ${e.clientY | 0}`;
            } else {
                // Digitizer Absolute
                const normX = Math.max(0, Math.min(1, e.clientX * invWidth));
                const normY = Math.max(0, Math.min(1, e.clientY * invHeight));
                const pressure = e.pressure > 0 ? e.pressure : 0.5;
                sendPacket(1, normX, normY, pressure, e.tiltX, e.tiltY);
                coordsEl.textContent = `${normX.toFixed(3)}, ${normY.toFixed(3)}`;
            }
        }, { passive: false });

        canvasArea.addEventListener("pointermove", (e) => {
            if (!activePointers.has(e.pointerId)) return;
            const prev = activePointers.get(e.pointerId);

            if (mode === "touchpad") {
                // Check if two-finger gesture
                if (activePointers.size === 2) {
                    const scrollDY = -(e.clientY - prev.y) * 1.5;
                    const scrollDX = (e.clientX - prev.x) * 1.5;
                    sendPacket(4, scrollDX, scrollDY, 0, 0, 0); // Action 4 = Scroll
                    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    coordsEl.textContent = `Scroll Δ ${scrollDY | 0}`;
                    return;
                }

                // 1-Finger Gliding: Calculate relative delta
                const rawDX = e.clientX - anchorX;
                const rawDY = e.clientY - anchorY;
                totalDisplacement += Math.hypot(rawDX, rawDY);

                // Trackpad Ballistics (acceleration curve)
                const speed = Math.hypot(rawDX, rawDY);
                const accel = Math.min(2.8, 1.0 + (speed * 0.04));
                const deltaX = rawDX * accel;
                const deltaY = rawDY * accel;

                // Is dragging or moving?
                const isDrag = (e.pointerType === "pen" && e.pressure > 0.15) || (e.buttons > 0 && totalDisplacement > 15);
                const actionCode = isDrag ? 2 : 0; // 2 = Drag, 0 = Relative Move
                const pressure = e.pressure > 0 ? e.pressure : (isDrag ? 0.6 : 0.0);

                sendPacket(actionCode, deltaX, deltaY, pressure, e.tiltX, e.tiltY);

                // Update anchor to current position
                anchorX = e.clientX;
                anchorY = e.clientY;
                activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                coordsEl.textContent = `Δ ${deltaX > 0 ? '+' : ''}${deltaX.toFixed(1)}, ${deltaY > 0 ? '+' : ''}${deltaY.toFixed(1)}`;
                pressureEl.textContent = pressure.toFixed(3);
                pressureBar.style.width = `${(pressure * 100).toFixed(0)}%`;

                indicator.style.left = e.clientX + "px";
                indicator.style.top = e.clientY + "px";
            } else {
                // Digitizer Absolute
                const normX = Math.max(0, Math.min(1, e.clientX * invWidth));
                const normY = Math.max(0, Math.min(1, e.clientY * invHeight));
                const pressure = e.pressure > 0 ? e.pressure : (e.buttons > 0 ? 0.5 : 0.0);
                const actionCode = e.buttons > 0 ? 2 : 0;
                sendPacket(actionCode, normX, normY, pressure, e.tiltX, e.tiltY);

                coordsEl.textContent = `${normX.toFixed(3)}, ${normY.toFixed(3)}`;
                pressureEl.textContent = pressure.toFixed(3);
                pressureBar.style.width = `${(pressure * 100).toFixed(0)}%`;

                indicator.style.display = "block";
                indicator.style.left = e.clientX + "px";
                indicator.style.top = e.clientY + "px";
            }
        }, { passive: false });

        const endPointer = (e) => {
            activePointers.delete(e.pointerId);

            if (mode === "touchpad") {
                const duration = Date.now() - touchStartTime;
                // Tap-to-click detection: Quick tap with little displacement
                if (duration < 240 && totalDisplacement < 10) {
                    sendPacket(1, 0, 0, 1.0, 0, 0); // Down
                    setTimeout(() => {
                        sendPacket(3, 0, 0, 0.0, 0, 0); // Up
                    }, 40);
                    coordsEl.textContent = "Tap: Click!";
                } else {
                    sendPacket(3, 0, 0, 0.0, 0, 0);
                }
            } else {
                sendPacket(3, 0, 0, 0.0, 0, 0);
            }

            if (activePointers.size === 0) {
                indicator.style.display = "none";
                pressureBar.style.width = "0%";
                pressureEl.textContent = "0.000";
            }
        };

        canvasArea.addEventListener("pointerup", endPointer, { passive: false });
        canvasArea.addEventListener("pointercancel", endPointer, { passive: false });

        // Prevent browser gestures
        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("touchmove", e => { if (e.scale !== 1) e.preventDefault(); }, { passive: false });
    </script>
</body>
</html>
